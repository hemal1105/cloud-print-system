<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Print Queue</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Glassmorphism Styles */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }
        /* Custom scrollbar for table */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="p-6 md:p-12 font-sans antialiased">

    <div class="max-w-7xl mx-auto space-y-12">
        
        <!-- Header -->
        <header class="text-center">
            <h1 class="text-4xl font-extrabold tracking-tight mb-2">Cloud Print Queue</h1>
            <p class="text-lg text-gray-200">Submit your files for printing or manage the queue.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- User Section: Upload Form -->
            <div class="glass rounded-2xl p-8 col-span-1">
                <h2 class="text-2xl font-bold mb-6 border-b border-white/20 pb-2">New Print Job</h2>
                <form id="uploadForm" class="space-y-5">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-100 mb-1">Name</label>
                        <input type="text" id="userName" required
                            class="w-full bg-white/20 border border-white/30 rounded-lg px-4 py-2 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-white/50"
                            placeholder="John Doe">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-100 mb-1">Roll Number</label>
                        <input type="text" id="rollNumber" required
                            class="w-full bg-white/20 border border-white/30 rounded-lg px-4 py-2 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-white/50"
                            placeholder="CS2024-001">
                    </div>

                    <!-- Drag & Drop File Upload -->
                    <div>
                        <label class="block text-sm font-medium text-gray-100 mb-1">File</label>
                        <div id="dropZone" class="border-2 border-dashed border-white/40 rounded-xl p-6 text-center cursor-pointer hover:bg-white/10 transition">
                            <input type="file" id="fileInput" class="hidden" required>
                            <svg class="mx-auto h-10 w-10 text-white/70 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                            </svg>
                            <p class="text-sm text-gray-200" id="fileNameDisplay">Click or drag file to upload</p>
                        </div>
                    </div>

                    <!-- Print Options -->
                    <div class="space-y-3">
                        <label class="block text-sm font-medium text-gray-100 border-b border-white/20 pb-1">Options</label>
                        
                        <div class="flex items-center gap-4">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="colorMode" value="B&W" checked class="accent-indigo-400 w-4 h-4">
                                <span class="text-sm">B&W</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="colorMode" value="Color" class="accent-indigo-400 w-4 h-4">
                                <span class="text-sm">Color</span>
                            </label>
                        </div>

                        <div class="flex items-center gap-4">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" id="duplexOption" class="accent-indigo-400 w-4 h-4 rounded">
                                <span class="text-sm">Double-Sided</span>
                            </label>
                        </div>

                        <div>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <span class="text-sm">Copies:</span>
                                <input type="number" id="copiesOption" value="1" min="1" max="100" class="w-16 bg-white/20 border border-white/30 rounded px-2 py-1 text-white focus:outline-none focus:ring-1 focus:ring-white/50 text-sm">
                            </label>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-white text-indigo-600 font-bold py-3 rounded-lg mt-4 hover:bg-gray-100 transition shadow-lg flex justify-center items-center">
                        <span id="btnText">Submit Print Job</span>
                        <svg id="btnSpinner" class="animate-spin ml-2 h-5 w-5 text-indigo-600 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                    <p id="uploadStatus" class="text-center text-sm font-medium mt-2 hidden"></p>
                </form>
            </div>

            <!-- Admin Section: Queue Dashboard -->
            <div class="glass rounded-2xl p-8 col-span-1 lg:col-span-2 flex flex-col h-full min-h-[500px]">
                <div class="flex justify-between items-center mb-6 border-b border-white/20 pb-2">
                    <h2 class="text-2xl font-bold">Admin Dashboard</h2>
                    <div class="flex items-center gap-2 text-sm text-green-300">
                        <span class="relative flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                        </span>
                        Live Queue
                    </div>
                </div>

                <div class="flex-grow overflow-x-auto overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-white/20 text-gray-200 text-sm">
                                <th class="py-3 px-4 font-semibold">User</th>
                                <th class="py-3 px-4 font-semibold">File</th>
                                <th class="py-3 px-4 font-semibold">Settings</th>
                                <th class="py-3 px-4 font-semibold">Time</th>
                                <th class="py-3 px-4 font-semibold text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="queueTableBody" class="text-sm">
                            <!-- Rows will be populated by JS -->
                            <tr>
                                <td colspan="5" class="text-center py-8 text-gray-300">Loading queue...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin; // Adjust if backend is on different port (e.g., "http://localhost:8000")

        // Form Elements
        const form = document.getElementById('uploadForm');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const uploadStatus = document.getElementById('uploadStatus');

        let selectedFile = null;

        // Drag and Drop Logic
        dropZone.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameDisplay.textContent = selectedFile.name;
                fileNameDisplay.classList.add('text-indigo-200', 'font-semibold');
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('bg-white/20', 'border-white');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('bg-white/20', 'border-white');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-white/20', 'border-white');
            if (e.dataTransfer.files.length > 0) {
                selectedFile = e.dataTransfer.files[0];
                fileInput.files = e.dataTransfer.files; // Sync with input
                fileNameDisplay.textContent = selectedFile.name;
                fileNameDisplay.classList.add('text-indigo-200', 'font-semibold');
            }
        });

        // Form Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!selectedFile) {
                alert("Please select a file to upload.");
                return;
            }

            // UI Loading state
            btnText.textContent = "Uploading...";
            btnSpinner.classList.remove('hidden');
            submitBtn.disabled = true;
            uploadStatus.classList.add('hidden');

            const formData = new FormData();
            formData.append('name', document.getElementById('userName').value);
            formData.append('roll', document.getElementById('rollNumber').value);

            const settings = {
                color: document.querySelector('input[name="colorMode"]:checked').value,
                duplex: document.getElementById('duplexOption').checked,
                copies: parseInt(document.getElementById('copiesOption').value)
            };
            formData.append('options', JSON.stringify(settings));
            
            // Append file last
            formData.append('file', selectedFile);

            console.log("Sending upload request to http://127.0.0.1:8000/upload");
            console.log("FormData keys: name, roll, options, file");

            try {
                const res = await fetch('http://127.0.0.1:8000/upload', {
                    method: 'POST',
                    body: formData
                });
                
                console.log("Upload response status:", res.status);

                if (!res.ok) {
                    const errorData = await res.json();
                    console.log("Server error:", errorData);
                    throw new Error(errorData.detail || "Upload failed");
                }

                // Success
                uploadStatus.textContent = "Job added to queue successfully!";
                uploadStatus.className = "text-center text-sm font-medium mt-2 text-green-300 block";
                form.reset();
                selectedFile = null;
                fileNameDisplay.textContent = "Click or drag file to upload";
                fileNameDisplay.classList.remove('text-indigo-200', 'font-semibold');
                
                // Immediately refresh queue
                fetchQueue();

            } catch (error) {
                console.error(error);
                uploadStatus.textContent = "Failed to upload. Please try again.";
                uploadStatus.className = "text-center text-sm font-medium mt-2 text-red-300 block";
            } finally {
                // UI Reset state
                btnText.textContent = "Submit Print Job";
                btnSpinner.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });

        // Fetch and Render Queue
        async function fetchQueue() {
            try {
                const res = await fetch(`${API_BASE_URL}/queue`);
                if (!res.ok) throw new Error("Failed to fetch queue");
                const jobs = await res.json();
                renderQueue(jobs);
            } catch (error) {
                console.error("Error fetching queue:", error);
            }
        }

        function renderQueue(jobs) {
            const tbody = document.getElementById('queueTableBody');
            tbody.innerHTML = '';

            if (jobs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-300">Queue is empty.</td></tr>`;
                return;
            }

            jobs.forEach(job => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-white/10 hover:bg-white/5 transition";
                
                const timeStr = new Date(job.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const fileName = job.file_url.split('/').pop() || "File";
                
                const settingsStr = `${job.page_settings.color}, ${job.page_settings.copies} copy(s)${job.page_settings.duplex ? ', Duplex' : ''}`;

                tr.innerHTML = `
                    <td class="py-3 px-4">
                        <div class="font-medium">${job.user_name}</div>
                        <div class="text-xs text-gray-300">${job.roll_number}</div>
                    </td>
                    <td class="py-3 px-4">
                        <a href="${job.file_url}" target="_blank" class="text-indigo-300 hover:text-indigo-100 underline decoration-indigo-300/50 underline-offset-2 truncate max-w-[150px] inline-block" title="${fileName}">
                            ${fileName}
                        </a>
                    </td>
                    <td class="py-3 px-4 text-gray-200">${settingsStr}</td>
                    <td class="py-3 px-4 text-gray-300">${timeStr}</td>
                    <td class="py-3 px-4 text-right">
                        <button onclick="markAsDone(${job.id})" class="bg-green-500/20 text-green-300 border border-green-500/30 hover:bg-green-500/40 px-3 py-1.5 rounded-md text-xs font-bold uppercase tracking-wide transition shadow-sm">
                            Done
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Complete Job
        async function markAsDone(jobId) {
            try {
                const res = await fetch(`${API_BASE_URL}/complete/${jobId}`, {
                    method: 'PATCH'
                });
                if (!res.ok) throw new Error("Failed to complete job");
                fetchQueue(); // Refresh immediately
            } catch (error) {
                console.error("Error completing job:", error);
                alert("Failed to mark job as done.");
            }
        }

        // Initial fetch and set interval
        fetchQueue();
        setInterval(fetchQueue, 5000);

    </script>
</body>
</html>
