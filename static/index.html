<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Print Queue | Production Ready</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { transition: all 0.3s ease; }
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: white;
            background: linear-gradient(-45deg, #1e1b4b, #312e81, #1e3a8a, #4338ca);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        body.light-mode { background: #f1f5f9; color: #0f172a; }
        body.light-mode .glass { background: rgba(255, 255, 255, 0.9); border: 1px solid #e2e8f0; color: #0f172a; }
    </style>
</head>
<body class="p-4 md:p-8">

<div id="successToast" class="fixed top-5 right-5 hidden bg-emerald-600 text-white px-6 py-4 rounded-2xl shadow-2xl z-50 animate-bounce">
    ✅ Print Job Submitted Successfully!
</div>

<div class="max-w-6xl mx-auto space-y-6">
    <!-- HEADER -->
    <header class="flex justify-between items-end border-b border-white/10 pb-6">
        <div>
            <h1 class="text-3xl md:text-5xl font-black tracking-tight">☁️ Cloud Print</h1>
            <p id="liveClock" class="text-lg font-medium opacity-80 mt-1"></p>
        </div>
        <button id="themeToggle" class="glass px-5 py-2 rounded-xl font-bold hover:scale-105 active:scale-95">🌓 Theme</button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- UPLOAD SECTION -->
        <div class="lg:col-span-4 glass rounded-3xl p-6 space-y-6">
            <h2 class="text-xl font-bold opacity-90">Create New Job</h2>
            <form id="uploadForm" class="space-y-4">
                <input type="text" id="userName" required placeholder="Student Name" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 focus:ring-2 ring-indigo-500 outline-none">
                <input type="text" id="rollNumber" required placeholder="Roll Number" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 focus:ring-2 ring-indigo-500 outline-none">
                
                <div id="dropZone" class="border-2 border-dashed border-white/20 rounded-2xl p-8 text-center cursor-pointer hover:bg-white/5 transition-colors">
                    <input type="file" id="fileInput" class="hidden" accept=".pdf,.doc,.docx,.jpg,.png">
                    <div class="text-3xl mb-2">📄</div>
                    <p id="fileNameDisplay" class="text-sm opacity-70">Click to upload document</p>
                </div>

                <div class="p-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/20">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-sm font-semibold">Mode:</span>
                        <div class="flex gap-2">
                            <label class="cursor-pointer">
                                <input type="radio" name="colorMode" value="B&W" checked onchange="calculateUIEstimate()" class="hidden peer">
                                <span class="px-3 py-1 rounded-lg border border-white/20 peer-checked:bg-white peer-checked:text-indigo-900 text-xs">B&W (₹1)</span>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="colorMode" value="Color" onchange="calculateUIEstimate()" class="hidden peer">
                                <span class="px-3 py-1 rounded-lg border border-white/20 peer-checked:bg-white peer-checked:text-indigo-900 text-xs">Color (₹10)</span>
                            </label>
                        </div>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-semibold">Copies:</span>
                        <input type="number" id="copiesOption" value="1" min="1" class="w-16 bg-white/10 border border-white/20 rounded-lg px-2 py-1 text-center" oninput="calculateUIEstimate()">
                    </div>
                </div>

                <div class="text-center py-4">
                    <p class="text-xs opacity-60 uppercase tracking-widest mb-1">Estimated Total</p>
                    <p id="uiCostEstimate" class="text-4xl font-black text-emerald-400">₹0</p>
                </div>

                <button type="submit" class="w-full bg-white text-indigo-900 font-bold py-4 rounded-2xl hover:shadow-[0_0_20px_rgba(255,255,255,0.3)] transition-all transform active:scale-95">
                    Submit to Queue
                </button>
            </form>
        </div>

        <!-- QUEUE SECTION -->
        <div class="lg:col-span-8 glass rounded-3xl p-6 flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold opacity-90">Live Print Queue</h2>
                <div class="text-right glass px-4 py-2 rounded-xl">
                    <p class="text-[10px] uppercase opacity-60">Revenue</p>
                    <p id="revenueAmount" class="text-xl font-black text-emerald-400">₹0</p>
                </div>
            </div>

            <div class="overflow-x-auto flex-grow">
                <table class="w-full text-left border-collapse">
                    <thead class="text-[10px] uppercase tracking-wider opacity-50 border-b border-white/10">
                        <tr>
                            <th class="pb-4 px-2">Student / Roll</th>
                            <th class="pb-4 px-2 text-center">Pages</th>
                            <th class="pb-4 px-2">Settings</th>
                            <th class="pb-4 px-2">Cost</th>
                            <th class="pb-4 px-2">Time (IST)</th>
                            <th class="pb-4 px-2 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="queueTableBody" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = "http://127.0.0.1:8000";
    let selectedFile = null;
    let allJobs = [];

    // 1. CLOCK (IST Fix)
    function updateClock() {
        const options = { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        document.getElementById('liveClock').textContent = new Date().toLocaleTimeString('en-IN', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    document.getElementById('themeToggle').addEventListener('click', () => document.body.classList.toggle('light-mode'));

    // 2. FILE SELECTION
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    document.getElementById('dropZone').addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
        selectedFile = e.target.files[0];
        if (selectedFile) {
            fileNameDisplay.textContent = selectedFile.name;
            calculateUIEstimate(); // Trigger estimate on file selection
        }
    });

    // 3. COST ESTIMATOR (UI ONLY)
    function calculateUIEstimate() {
        const copies = parseInt(document.getElementById('copiesOption').value) || 1;
        const colorMode = document.querySelector('input[name="colorMode"]:checked').value;
        const rate = (colorMode === "Color") ? 10 : 1;
        // UI Estimate (Assuming 1 page until backend confirms)
        document.getElementById('uiCostEstimate').textContent = `₹${rate * copies}`;
    }

    // 4. SUBMIT JOB
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!selectedFile) return alert("Please select a file first!");

        const formData = new FormData();
        formData.append('name', document.getElementById('userName').value);
        formData.append('roll', document.getElementById('rollNumber').value);
        
        const settings = {
            color: document.querySelector('input[name="colorMode"]:checked').value,
            copies: parseInt(document.getElementById('copiesOption').value) || 1,
            duplex: false,
            timestamp_ms: Date.now() // Send precise local timestamp
        };

        formData.append('options', JSON.stringify(settings));
        formData.append('file', selectedFile);

        try {
            const res = await fetch(`${API_BASE_URL}/upload`, { method: 'POST', body: formData });
            if (res.ok) {
                const result = await res.json();
                console.log("Uploaded pages:", result.pages); // Debug check
                
                document.getElementById('successToast').classList.remove('hidden');
                setTimeout(() => document.getElementById('successToast').classList.add('hidden'), 3000);
                
                e.target.reset();
                selectedFile = null;
                fileNameDisplay.textContent = "Click to upload document";
                calculateUIEstimate();
                fetchQueue();
            } else {
                alert("Server error during upload.");
            }
        } catch (err) {
            alert("Connection error. Is the FastAPI server running?");
        }
    });

    // 5. FETCH & RENDER QUEUE
    async function fetchQueue() {
        try {
            const res = await fetch(`${API_BASE_URL}/queue`);
            allJobs = await res.json();
            renderQueue(allJobs);
        } catch (err) { console.warn("Fetch failed"); }
    }

  function renderQueue(jobs) {
        const tbody = document.getElementById('queueTableBody');
        tbody.innerHTML = '';
        let totalRev = 0;

        jobs.forEach(job => {
            totalRev += (job.total_cost || 0);
            const fileName = job.file_url.split('/').pop();
            
            // --- TIME FIX (IST) ---
            // We treat the timestamp as a local date string
            const dateObj = new Date(job.timestamp);
            const timeIST = dateObj.toLocaleTimeString('en-IN', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });

            const s = job.page_settings;
            // Handle both object and string settings for safety
            const color = s.color || "B&W";
            const copies = s.copies || 1;

            // Inside renderQueue(jobs) loop:
const tr = document.createElement('tr');
tr.className = "hover:bg-white/5 transition-colors group";

// Use a fallback to 0 if total_cost is missing
const displayCost = job.total_cost !== undefined ? job.total_cost : 0;
const displayPages = job.page_count !== undefined ? job.page_count : 1;

tr.innerHTML = `
    <td class="py-4 px-2">
        <div class="font-bold text-sm">${job.user_name}</div>
        <div class="text-[10px] opacity-50">${job.roll_number}</div>
    </td>
    <td class="py-4 px-2 text-center text-xs font-mono">${displayPages}</td>
    <td class="py-4 px-2 text-[10px] opacity-70">${job.page_settings.color} | ${job.page_settings.copies} Copy</td>
    <td class="py-4 px-2 font-bold text-emerald-400">₹${displayCost}</td>
    <td class="py-4 px-2 text-[10px] font-medium">${timeIST}</td>
    <td class="py-4 px-2 text-right space-x-1">
        <a href="${API_BASE_URL}/view/${fileName}" target="_blank" class="px-2 py-1 bg-indigo-500/20 text-indigo-300 rounded text-[9px] font-bold">VIEW</a>
        <button onclick="markDone(${job.id})" class="px-2 py-1 bg-emerald-500/20 text-emerald-400 rounded text-[9px] font-bold">DONE</button>
    </td>
`;
            tbody.appendChild(tr);
        });
        document.getElementById('revenueAmount').textContent = `₹${totalRev}`;
    }

    async function markDone(id) {
        if (!confirm("Is printing completed? This will remove the job.")) return;
        await fetch(`${API_BASE_URL}/complete/${id}`, { method: 'PATCH' });
        fetchQueue();
    }

    // Auto-refresh every 5 seconds
    fetchQueue();
    setInterval(fetchQueue, 5000);
</script>
</body>
</html>
